name: Release

# v로 시작하는 태그를 올리면 (예: git tag v1.0.0 && git push origin v1.0.0)
# 자동으로 Whip.app을 빌드해서 GitHub Releases에 DMG/ZIP으로 올림
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build Whip.app
        run: ./scripts/build-app.sh

      - name: Make DMG / ZIP
        run: ./scripts/make-dmg.sh

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/Whip-*.dmg
            build/Whip-*.zip
          generate_release_notes: true
