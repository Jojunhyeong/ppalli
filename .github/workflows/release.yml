name: Release

# v로 시작하는 태그를 올리면 (예: git tag v1.0.0 && git push origin v1.0.0)
# 자동으로 Ppalli.app을 빌드해서 GitHub Releases에 DMG/ZIP으로 올림
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build Ppalli.app
        run: ./scripts/build-app.sh

      - name: Make DMG / ZIP
        run: ./scripts/make-dmg.sh

      # CHANGELOG.md에서 이 버전의 패치 내용을 꺼내 릴리스 노트로 씀
      - name: Release notes
        run: |
          ./scripts/release-notes.sh "$VERSION" > build/notes.md
          if [ ! -s build/notes.md ]; then
            echo "::warning::CHANGELOG.md에 $VERSION 칸이 없어요"
            echo "Ppalli $VERSION" > build/notes.md
          fi
          cat build/notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/Ppalli-*.dmg
            build/Ppalli-*.zip
          name: Ppalli ${{ env.VERSION }}
          body_path: build/notes.md
